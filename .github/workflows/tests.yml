name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test recovery, concurrency and process crashes
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate installation and installed CLI
        run: |
          python -m pip install .
          commitlatch --version
          commitlatch demo
          commitlatch http-demo
  langgraph-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install . -r examples/requirements-langgraph.txt
      - name: Reconcile or stop without dispatching twice
        env:
          LANGSMITH_TRACING: 'false'
        run: |
          python examples/langgraph_recovery.py
          python examples/langgraph_recovery.py --opaque
