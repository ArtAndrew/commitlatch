name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Test recovery, concurrency and process crashes
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Validate installation and installed CLI
        run: |
          python -m pip install .
          commitlatch --version
          commitlatch demo
